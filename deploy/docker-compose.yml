# yika 生产级编排（开发文档 §11.1）
# usage: docker compose -f deploy/docker-compose.yml up -d
services:
  nginx:
    image: nginx:stable
    ports: ["8443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [backend]
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://yika:yika_pass@postgres:5432/yika
      ASR_BASE_URL: http://stt:8051
      TTS_BASE_URL: http://tts:8052
      CORS_ORIGINS: https://<你的内网域名>
    volumes:
      - audio-data:/app/storage/audio
      - tts-data:/app/storage/tts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      stt:
        condition: service_started
      tts:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    command: python -m app.worker
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://yika:yika_pass@postgres:5432/yika
      ASR_BASE_URL: http://stt:8051
      TTS_BASE_URL: http://tts:8052
    volumes:
      - audio-data:/app/storage/audio
      - tts-data:/app/storage/tts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: yika
      POSTGRES_PASSWORD: yika_pass
      POSTGRES_DB: yika
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yika"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # STT：Qwen3-ASR-1.7B（决定 09）
  stt:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.stt
    environment:
      ASR_MODEL_DIR: /models/qwen3-asr-1.7b
    volumes:
      - /d/models/yika/asr:/models:ro
    ports: ["8051:8051"]
    restart: unless-stopped

  # TTS：dots.tts-mf（决策 09）
  tts:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tts
    environment:
      TTS_MODEL_DIR: /models/dots-tts-mf
      TTS_REF_AUDIO: /models/ref.wav
      TTS_REF_TEXT: "你好，这是参考音色。"
    volumes:
      - /d/models/yika/tts:/models:ro
    ports: ["8052:8052"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: change-me
    volumes:
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  audio-data:
  tts-data:
  prom-data:
  grafana-data:
