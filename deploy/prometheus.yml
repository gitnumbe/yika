# yika Prometheus 配置（开发文档 §11.5）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: yika-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: yika-stt
    static_configs:
      - targets: ["stt:8051"]

  - job_name: yika-tts
    static_configs:
      - targets: ["tts:8052"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
